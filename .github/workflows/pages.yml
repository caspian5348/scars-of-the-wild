name: Publish single-player game
on:
  push:
    branches: [main]
    paths: ['game-part-*.zip']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack single-player snapshot
        run: |
          mkdir -p site
          for archive in game-part-*.zip; do unzip -q "$archive" -d site; done
          test -f site/index.html
          test -f site/game/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
